[project]
name = "statgis"
version = "0.1.0"
description = "Package to geospatial analysis and statistics."
authors = [
    {name = "Sebástian Andrés Narváez Salcedo",email = "snarvaezwrm@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "statgis", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
